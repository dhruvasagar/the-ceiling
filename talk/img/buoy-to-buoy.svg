<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>YJIT swims buoy to buoy</title>
  <rect width="1600" height="900" fill="#e6f2fb"/>
  <text x="80" y="120" font-size="64" font-weight="700" fill="#1b2733">YJIT: buoy to buoy</text>
  <path d="M160 470 Q370 400 560 470 Q760 400 960 470 Q1160 400 1360 470" stroke="#c48a00" stroke-width="8" stroke-dasharray="22 14" fill="none"/>
  <g fill="#f08a24"><circle cx="160" cy="470" r="26"/><circle cx="560" cy="470" r="26"/><circle cx="960" cy="470" r="26"/><circle cx="1360" cy="470" r="26"/></g>
  <g font-size="56" text-anchor="middle"><g transform="translate(160,392)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g><g transform="translate(560,392)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g><g transform="translate(960,392)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g><g transform="translate(1360,392)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g></g>
  <g font-size="36" text-anchor="middle" fill="#7a5a00">
    <text x="360" y="560">decide this leg</text><text x="760" y="560">decide this leg</text><text x="1160" y="560">decide this leg</text>
  </g>
  <text x="80" y="720" font-size="48" fill="#1b2733">Once it's warmed up: swim a leg, look, decide the next leg.</text>
  <text x="80" y="790" font-size="40" fill="#4a5a6a">Compile a little, run it, look at the real values, compile the next bit.</text>
  <text x="80" y="850" font-size="40" fill="#4a5a6a">25 small compiles for our five-line method.</text>
</svg>
