<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The 2-beat kick: improving one kick at a time keeps all six; seeing the whole stroke lets you drop four. YJIT improves each block and the call stays; ZJIT sees the whole method and drops it.</title>
  <rect width="1600" height="900" fill="#e6f2fb"/>
  <text x="80" y="100" font-size="60" font-weight="700" fill="#1b2733">The 2-beat kick: the same ceiling, in the water</text>
  <text x="80" y="160" font-size="32" fill="#4a5a6a">The goal in both: the same speed for less effort.</text>

  <!-- column headers and divider -->
  <text x="80" y="240" font-size="36" font-weight="700" fill="#4a5a6a">In the water</text>
  <text x="900" y="240" font-size="36" font-weight="700" fill="#4a5a6a">In our Ruby</text>
  <path d="M860 210 V735" stroke="#9cc7e6" stroke-width="4"/>

  <!-- row 1: one at a time -->
  <text x="80" y="305" font-size="34" font-weight="700" fill="#7a5a00">One kick at a time</text>
  <path d="M100 360 H780" stroke="#9cc7e6" stroke-width="4"/>
  <g fill="#c48a00">
    <circle cx="140" cy="360" r="14"/><circle cx="260" cy="360" r="14"/><circle cx="380" cy="360" r="14"/>
    <circle cx="500" cy="360" r="14"/><circle cx="620" cy="360" r="14"/><circle cx="740" cy="360" r="14"/>
  </g>
  <text x="80" y="425" font-size="32" fill="#1b2733">Make each kick stronger:</text>
  <text x="80" y="465" font-size="32" fill="#1b2733">still six kicks of effort every stroke.</text>

  <text x="900" y="305" font-size="34" font-weight="700" fill="#7a5a00">YJIT, one block at a time</text>
  <text x="900" y="365" font-size="32" fill="#1b2733">Make each block faster:</text>
  <text x="900" y="405" font-size="32" fill="#1b2733">the call to sq and its guards stay,</text>
  <text x="900" y="445" font-size="32" fill="#1b2733">because they sit between blocks.</text>

  <!-- row 2: the whole stroke -->
  <text x="80" y="540" font-size="34" font-weight="700" fill="#1f6a2c">The whole stroke</text>
  <path d="M100 640 H780" stroke="#9cc7e6" stroke-width="4"/>
  <path d="M140 640 Q300 560 460 640" stroke="#2e8b3e" stroke-width="7" fill="none"/>
  <path d="M460 640 Q620 560 780 640" stroke="#2e8b3e" stroke-width="7" fill="none"/>
  <text x="300" y="585" font-size="26" text-anchor="middle" fill="#1f6a2c">left arm</text>
  <text x="620" y="585" font-size="26" text-anchor="middle" fill="#1f6a2c">right arm</text>
  <g fill="#2e8b3e"><circle cx="300" cy="640" r="17"/><circle cx="620" cy="640" r="17"/></g>
  <text x="80" y="700" font-size="32" fill="#1b2733">See the kicks against the arms:</text>
  <text x="80" y="740" font-size="32" fill="#1b2733">drop four, time two to the strokes.</text>

  <text x="900" y="540" font-size="34" font-weight="700" fill="#1f6a2c">ZJIT, the whole method</text>
  <text x="900" y="600" font-size="32" fill="#1b2733">See distance and sq together:</text>
  <text x="900" y="640" font-size="32" fill="#1b2733">drop the call and its guards,</text>
  <text x="900" y="680" font-size="32" fill="#1b2733">keep the multiply.</text>

  <!-- bottom line -->
  <text x="80" y="825" font-size="44" font-weight="700" fill="#1b2733">What you look at sets what you can drop.</text>
  <text x="80" y="872" font-size="30" fill="#4a5a6a">The ZJIT team's word for it: the compilation unit.</text>
</svg>
