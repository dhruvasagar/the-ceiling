<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The 2-beat kick is timed to the whole stroke cycle</title>
  <rect width="1600" height="900" fill="#e6f2fb"/>
  <text x="80" y="110" font-size="64" font-weight="700" fill="#1b2733">The 2-beat kick: fewer kicks, better placed</text>
  <!-- top row: kick by kick -->
  <text x="80" y="250" font-size="44" font-weight="700" fill="#7a5a00">Kick by kick</text>
  <path d="M520 240 H1500" stroke="#9cc7e6" stroke-width="4"/>
  <g fill="#c48a00">
    <circle cx="560" cy="240" r="16"/><circle cx="720" cy="240" r="16"/><circle cx="880" cy="240" r="16"/>
    <circle cx="1040" cy="240" r="16"/><circle cx="1200" cy="240" r="16"/><circle cx="1360" cy="240" r="16"/>
  </g>
  <text x="560" y="320" font-size="36" fill="#7a5a00">make each kick better... and you still kick six times</text>
  <!-- bottom row: whole cycle -->
  <text x="80" y="500" font-size="44" font-weight="700" fill="#1f6a2c">Whole cycle</text>
  <path d="M520 490 H1500" stroke="#9cc7e6" stroke-width="4"/>
  <!-- arm strokes as arcs -->
  <path d="M560 490 Q760 380 960 490" stroke="#2e8b3e" stroke-width="8" fill="none"/>
  <path d="M960 490 Q1160 380 1360 490" stroke="#2e8b3e" stroke-width="8" fill="none"/>
  <text x="760" y="410" font-size="36" text-anchor="middle" fill="#1f6a2c">left arm</text>
  <text x="1160" y="410" font-size="36" text-anchor="middle" fill="#1f6a2c">right arm</text>
  <g fill="#2e8b3e"><circle cx="760" cy="490" r="20"/><circle cx="1160" cy="490" r="20"/></g>
  <text x="560" y="570" font-size="36" fill="#1f6a2c">one kick per arm stroke, timed to the whole cycle</text>
  <text x="80" y="720" font-size="48" fill="#1b2733">You can't get there one kick at a time.</text>
  <text x="80" y="790" font-size="48" fill="#1b2733">You have to see the <tspan font-weight="700">whole stroke</tspan>.</text>
  <text x="80" y="855" font-size="40" fill="#4a5a6a">In Ruby: fewer calls and checks, placed by seeing the whole method.</text>
</svg>
