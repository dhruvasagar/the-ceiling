<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The beginner lifts their head every stroke</title>
  <rect width="1600" height="900" fill="#e6f2fb"/>
  <path d="M0 520 Q100 500 200 520 T400 520 T600 520 T800 520 T1000 520 T1200 520 T1400 520 T1600 520" fill="none" stroke="#9cc7e6" stroke-width="6"/>
  <text x="80" y="120" font-size="64" font-weight="700" fill="#1b2733">The interpreter: a beginner swimmer</text>
  <g fill="#1b2733" font-size="44" text-anchor="middle">
    <g><circle cx="200" cy="470" r="26" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><g transform="translate(200,382)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g></g>
    <g><circle cx="420" cy="470" r="26" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><g transform="translate(420,382)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g></g>
    <g><circle cx="640" cy="470" r="26" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><g transform="translate(640,382)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g></g>
    <g><circle cx="860" cy="470" r="26" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><g transform="translate(860,382)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g></g>
    <g><circle cx="1080" cy="470" r="26" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><g transform="translate(1080,382)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g></g>
    <g><circle cx="1300" cy="470" r="26" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><g transform="translate(1300,382)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g></g>
  </g>
  <g font-size="36" fill="#4a5a6a" text-anchor="middle">
    <text x="200" y="600">stroke</text><text x="420" y="600">stroke</text><text x="640" y="600">stroke</text>
    <text x="860" y="600">stroke</text><text x="1080" y="600">stroke</text><text x="1300" y="600">stroke</text>
  </g>
  <text x="80" y="760" font-size="48" fill="#1b2733">Head up <tspan font-weight="700">every stroke</tspan>: "where am I? is this still right?"</text>
  <text x="80" y="830" font-size="40" fill="#4a5a6a">Safe. Slow. Ruby checks "what type is this?" on every instruction.</text>
</svg>
