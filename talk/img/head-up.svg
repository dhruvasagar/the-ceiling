<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The beginner lifts their head every stroke</title>
  <rect width="1600" height="900" fill="#e6f2fb"/>
  <path d="M0 520 Q100 500 200 520 T400 520 T600 520 T800 520 T1000 520 T1200 520 T1400 520 T1600 520" fill="none" stroke="#9cc7e6" stroke-width="6"/>
  <text x="80" y="120" font-size="64" font-weight="700" fill="#1b2733">The interpreter: a beginner swimmer</text>
  <g fill="#1b2733" font-size="44" text-anchor="middle">
    <g><g transform="translate(200,470)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g></g>
    <g><g transform="translate(420,470)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g></g>
    <g><g transform="translate(640,470)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g></g>
    <g><g transform="translate(860,470)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g></g>
    <g><g transform="translate(1080,470)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g></g>
    <g><g transform="translate(1300,470)"><circle r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/><ellipse cx="-11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><ellipse cx="11" cy="-6" rx="8" ry="10" fill="#fff" stroke="#1b2733" stroke-width="3"/><circle cx="-9" cy="-9" r="4" fill="#1b2733"/><circle cx="13" cy="-9" r="4" fill="#1b2733"/></g></g>
  </g>
  <g font-size="36" fill="#4a5a6a" text-anchor="middle">
    <text x="200" y="600">stroke</text><text x="420" y="600">stroke</text><text x="640" y="600">stroke</text>
    <text x="860" y="600">stroke</text><text x="1080" y="600">stroke</text><text x="1300" y="600">stroke</text>
  </g>
  <text x="80" y="760" font-size="48" fill="#1b2733">Head up <tspan font-weight="700">every stroke</tspan>: "where am I? is this still right?"</text>
  <text x="80" y="830" font-size="40" fill="#4a5a6a">Safe. Slow. Ruby asks "what type is this?" at every operation, every time.</text>
</svg>
