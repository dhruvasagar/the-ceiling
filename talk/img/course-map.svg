<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>ZJIT studies the course first</title>
  <rect width="1600" height="900" fill="#e6f2fb"/>
  <rect x="0" y="160" width="300" height="560" fill="#f3e2b8"/>
  <text x="150" y="210" font-size="36" text-anchor="middle" fill="#6b5222">the beach</text>
  <text x="80" y="120" font-size="64" font-weight="700" fill="#1b2733">ZJIT: study the course first</text>
  <!-- swimmer with map on the beach -->
  <circle cx="150" cy="420" r="30" fill="#f2c9a1" stroke="#1b2733" stroke-width="4"/>
  <g transform="translate(150,328)"><path d="M-36 -22 L-12 -30 L12 -22 L36 -30 L36 26 L12 34 L-12 26 L-36 34 Z" fill="#fdf6df" stroke="#1b2733" stroke-width="4"/><path d="M-12 -30 V26 M12 -22 V34" stroke="#1b2733" stroke-width="3"/><path d="M-28 18 Q-6 -10 28 -14" stroke="#2e8b3e" stroke-width="4" fill="none" stroke-dasharray="6 5"/></g>
  <text x="150" y="510" font-size="36" text-anchor="middle" fill="#1b2733">watch first</text>
  <!-- warm-up lap -->
  <ellipse cx="460" cy="290" rx="110" ry="60" fill="none" stroke="#2e8b3e" stroke-width="5" stroke-dasharray="6 10"/>
  <text x="460" y="210" font-size="36" text-anchor="middle" fill="#1f6a2c">warm-up lap</text>
  <!-- planned whole course -->
  <path d="M300 470 Q560 420 760 470 Q1000 520 1160 470 Q1320 420 1460 470" stroke="#2e8b3e" stroke-width="10" fill="none"/>
  <g fill="#f08a24"><circle cx="760" cy="470" r="26"/><circle cx="1160" cy="470" r="26"/><circle cx="1460" cy="470" r="26"/></g>
  <text x="880" y="590" font-size="40" text-anchor="middle" fill="#1f6a2c">the whole loop, planned before the start</text>
  <text x="80" y="790" font-size="48" fill="#1b2733">First a <tspan font-weight="700">profile</tspan>: watch which types turn up. Then plan it all at once.</text>
  <text x="80" y="850" font-size="40" fill="#4a5a6a">Prove, don't guess. One compile for the whole method.</text>
</svg>
