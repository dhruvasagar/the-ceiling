<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>The plateau: straight code is already fast; the time left is at method calls</title>
  <rect width="1600" height="900" fill="#e6f2fb"/>
  <text x="80" y="100" font-size="64" font-weight="700" fill="#1b2733">The plateau</text>

  <!-- left: the swim -->
  <text x="80" y="175" font-size="34" font-weight="700" fill="#4a5a6a">In the water</text>
  <path d="M130 210 V560 H700" stroke="#1b2733" stroke-width="4" fill="none"/>
  <text x="100" y="385" font-size="28" fill="#4a5a6a" text-anchor="middle" transform="rotate(-90 100 385)">time per swim</text>
  <text x="415" y="605" font-size="28" fill="#4a5a6a" text-anchor="middle">weeks of training</text>
  <path d="M150 235 Q230 260 290 350 Q350 440 420 465 L680 467" stroke="#c48a00" stroke-width="7" stroke-dasharray="20 12" fill="none"/>
  <g fill="#c48a00">
    <circle cx="150" cy="235" r="8"/><circle cx="230" cy="268" r="8"/><circle cx="290" cy="350" r="8"/>
    <circle cx="355" cy="440" r="8"/><circle cx="420" cy="465" r="8"/><circle cx="510" cy="466" r="8"/>
    <circle cx="600" cy="467" r="8"/><circle cx="680" cy="467" r="8"/>
  </g>
  <text x="310" y="290" font-size="28" fill="#7a5a00">sighting: faster every week</text>
  <text x="440" y="430" font-size="28" fill="#7a5a00">...then flat</text>
  <text x="130" y="665" font-size="30" fill="#1f6a2c">Straight legs: already fast.</text>
  <text x="130" y="710" font-size="30" fill="#b23a3a">The time left: the turns.</text>

  <!-- divider -->
  <path d="M770 160 V720" stroke="#9cc7e6" stroke-width="4"/>

  <!-- right: the code -->
  <text x="820" y="175" font-size="34" font-weight="700" fill="#4a5a6a">In our Ruby</text>
  <rect x="820" y="205" width="710" height="170" rx="14" fill="#ffffff" stroke="#9cc7e6" stroke-width="3"/>
  <text x="845" y="250" font-size="30" font-weight="700" fill="#1f6a2c">Straight code:</text>
  <text x="1065" y="250" font-size="30" font-family="ui-monospace, Menlo, monospace" fill="#1b2733">dx * dx</text>
  <text x="845" y="300" font-size="28" fill="#1b2733">YJIT: no type check. ZJIT: no type check.</text>
  <text x="845" y="345" font-size="28" fill="#4a5a6a">A tie. YJIT already gets these wins.</text>

  <rect x="820" y="400" width="710" height="300" rx="14" fill="#ffffff" stroke="#e8a0a0" stroke-width="3"/>
  <text x="845" y="445" font-size="30" font-weight="700" fill="#b23a3a">A call to a method that does work:</text>
  <text x="845" y="495" font-size="28" font-weight="700" fill="#1b2733">YJIT, one piece at a time:</text>
  <text x="845" y="535" font-size="28" fill="#1b2733">check the argument, make a real call, check the result</text>
  <text x="845" y="595" font-size="28" font-weight="700" fill="#1b2733">ZJIT, the whole method as one plan:</text>
  <text x="845" y="635" font-size="28" fill="#1b2733">copy the method in, drop the checks on both sides</text>
  <text x="845" y="680" font-size="24" fill="#4a5a6a">(a light frame stays; more on the next slides)</text>

  <text x="80" y="800" font-size="40" fill="#1b2733">A design limit, not YJIT standing still: it never sees the whole</text>
  <text x="80" y="852" font-size="40" fill="#1b2733">method, so a call doing real work stays a call. ZJIT plans it all.</text>
</svg>
