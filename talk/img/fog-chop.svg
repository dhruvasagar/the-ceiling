<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Fog and chop: everyone swims head-up again</title>
  <rect width="1600" height="900" fill="#d7e3ec"/>
  <g fill="none" stroke="#5b86a8" stroke-width="8">
    <path d="M0 520 L80 470 L160 540 L240 460 L320 545 L400 465 L480 540 L560 455 L640 545 L720 460 L800 540 L880 455 L960 545 L1040 465 L1120 540 L1200 460 L1280 545 L1360 465 L1440 540 L1520 460 L1600 530"/>
  </g>
  <rect width="1600" height="420" fill="#ffffff" opacity="0.55"/>
  <text x="80" y="110" font-size="64" font-weight="700" fill="#1b2733">Fog and chop</text>
  <g font-size="52" text-anchor="middle">
    <g transform="translate(300,422)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g><g transform="translate(520,422)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g><g transform="translate(740,422)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g>
    <g transform="translate(960,422)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g><g transform="translate(1180,422)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g><g transform="translate(1400,422)"><ellipse cx="-15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><ellipse cx="15" cy="0" rx="13" ry="17" fill="#fff" stroke="#1b2733" stroke-width="4"/><circle cx="-12" cy="3" r="6" fill="#1b2733"/><circle cx="18" cy="3" r="6" fill="#1b2733"/></g>
  </g>
  <text x="80" y="680" font-size="48" fill="#1b2733">When the water keeps changing, nobody can plan. Everyone looks up.</text>
  <text x="80" y="760" font-size="40" fill="#4a5a6a">Ruby that won't hold still: a value that's a different type each call,</text>
  <text x="80" y="815" font-size="40" fill="#4a5a6a">send(dynamic), method_missing, eval.</text>
</svg>
